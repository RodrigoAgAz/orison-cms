name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Typecheck and web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The Prisma client's types are generated from the schema; no database is needed.
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test

  device:
    name: Device firmware tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests psutil
      - run: npm run test:device
